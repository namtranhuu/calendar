name: Lịch Âm Việt Nam

on:
  schedule:
    # Run at 00:00 on Jan 1st every year
    - cron: '0 0 1 1 *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install lunar-vn; fi

      - name: Generate ICS file
        run: |
          python amlich.py

      - name: Commit and push changes
        run: |
          git config --local user.email "namth587@gmail.com"
          git config --local user.name "Nam Tran Huu"
          git add amlich.ics
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "Lịch Âm Việt Nam $(date +'%Y')"
            git push
          else
            echo "No changes to commit"
          fi
